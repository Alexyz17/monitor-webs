services:
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sites.json:/config/sites.json:ro
      - monitor-state:/data
      - status-page:/status

  # Sirve la página de estado en http://localhost:8080
  status:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # nocopy: sin él, Docker llena el volumen con el index.html de nginx (de root) y el monitor no puede escribirlo
      - type: volume
        source: status-page
        target: /usr/share/nginx/html
        read_only: true
        volume: { nocopy: true }

volumes:
  monitor-state:
  status-page:
