services:
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sites.json:/config/sites.json:ro
      - monitor-state:/data
      - status-page:/status

  # Sirve la página de estado en http://localhost:8080
  status:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - status-page:/usr/share/nginx/html:ro

volumes:
  monitor-state:
  status-page:
